name: Release

# Marketplace users pin to a floating major tag (`@v1`), so publishing v1.2.3
# means nothing to them until `v1` is moved to it. Doing that by hand is easy
# to forget and silently strands everyone on the old code.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  move-major-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Point the major tag at this release
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          major="${version%%.*}"           # v1.2.3 -> v1
          echo "Moving ${major} to ${version} (${GITHUB_SHA})"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${major}" "${GITHUB_SHA}"
          git push -f origin "refs/tags/${major}"
